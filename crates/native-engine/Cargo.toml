[package]
name = "native-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "GPL-3.0-or-later"
description = "Native Nextcloud/OpenCloud sync engine (WebDAV, chunked v2, TUS)"

[dependencies]
filetime = "0.2"
sha1 = "0.10"
ureq = { version = "~3.2", default-features = false, features = ["rustls-no-provider", "gzip"] }
rustls = "0.23"
rustls-native-certs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
roxmltree = "0.21"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"

[[bin]]
name = "native-engine-cli"
path = "src/main.rs"
