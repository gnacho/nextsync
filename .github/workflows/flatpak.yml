name: Flatpak bundle

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Resolve version
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Manifest tracks this tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          grep -q "refs/tags/$tag.tar.gz" flatpak/io.github.gnacho.nextsync.yml \
            || { echo "flatpak manifest does not point at $tag, bump it before releasing"; exit 1; }

      - name: Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Sdk//51
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build
        run: |
          flatpak-builder --force-clean --repo=repo build-dir flatpak/io.github.gnacho.nextsync.yml
          flatpak build-bundle repo "nextsync-${{ steps.version.outputs.number }}-x86_64.flatpak" io.github.gnacho.nextsync

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "nextsync-${{ steps.version.outputs.number }}-x86_64.flatpak" --clobber
